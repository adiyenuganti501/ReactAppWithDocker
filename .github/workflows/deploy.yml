name: React CI/CD

on:
  push:
    branches: ["master"]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Setup Node
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3️⃣ Install + Build
    - name: Install dependencies
      run: npm ci

    - name: Build React app
      run: CI=false npm run build

    # 4️⃣ Set Image Tag
    - name: Set image tag
      run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    # 5️⃣ AWS Login
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    # 6️⃣ Build & Push (single optimized step)
    - name: Build and push Docker image
      run: |
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REPOSITORY:$IMAGE_TAG

    # 7️⃣ (Optional) Deploy to EKS
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name k8s-practice

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/nginx-deployment nginx=$ECR_REPOSITORY:$IMAGE_TAG || \
        kubectl apply -f deployment.yaml

    - name: Verify rollout
      run: kubectl rollout status deployment/nginx-deployment

    8️⃣ Done
    - name: Pipeline finished
      run: echo "🚀 CI/CD completed successfully"